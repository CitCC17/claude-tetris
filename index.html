<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle">
      <span class="toggle-icon">&#9790;</span>
      <span class="toggle-label">LIGHT</span>
    </button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <aside class="panel">
        <div class="panel-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>
        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">—</span>
          <span class="badge hidden" id="b2b">B2B ACTIVO</span>
        </div>
        <div class="panel-section">
          <span class="label">ENERGÍA</span>
          <div class="energy-bar"><div id="energy-fill"></div></div>
          <span class="hint" id="energy-hint">0%</span>
        </div>
      </aside>

      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section hidden" id="objective-section">
          <span class="label">OBJETIVO</span>
          <span class="objective" id="objective"></span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
          <span class="badge hidden" id="next-power"></span>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd><kbd>Shift</kbd> hold</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>E</kbd> habilidad</li>
            <li><kbd>M</kbd> sonido</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
        <button id="menu-btn">Cambiar modo</button>
      </div>
    </div>

    <div id="mode-menu" class="overlay hidden">
      <div class="overlay-box">
        <p class="overlay-heading">ELIGE MODO</p>
        <div class="menu-list">
          <button class="menu-btn" data-mode="classic"><kbd>1</kbd><span><b>Clásico</b><small>Sin objetivo: aguanta todo lo que puedas</small></span></button>
          <button class="menu-btn" data-mode="sprint"><kbd>2</kbd><span><b>Sprint 40</b><small>Limpia 40 líneas en 2 minutos</small></span></button>
          <button class="menu-btn" data-mode="garbage"><kbd>3</kbd><span><b>Basura</b><small>Sobrevive 2 min con basura subiendo cada 10 s</small></span></button>
          <button class="menu-btn" data-mode="fixed"><kbd>4</kbd><span><b>Bloques fijos</b><small>Elimina todos los bloques pre-colocados</small></span></button>
          <button class="menu-btn" data-mode="invisible"><kbd>5</kbd><span><b>Invisible</b><small>Las piezas desaparecen al tocar suelo · 20 líneas</small></span></button>
          <button class="menu-btn" data-mode="reverse"><kbd>6</kbd><span><b>Rotación inversa</b><small>Desde el nivel 5 la rotación se invierte · 20 líneas</small></span></button>
        </div>
      </div>
    </div>

    <div id="ability-menu" class="overlay hidden">
      <div class="overlay-box">
        <p class="overlay-heading">HABILIDAD</p>
        <div class="menu-list">
          <button class="menu-btn" data-ability="preview"><kbd>1</kbd> Ver siguientes 5 piezas</button>
          <button class="menu-btn" data-ability="swap"><kbd>2</kbd> Intercambiar pieza actual</button>
          <button class="menu-btn" data-ability="slow"><kbd>3</kbd> Ralentizar tiempo 10s</button>
          <button class="menu-btn" data-ability="undo"><kbd>4</kbd> Deshacer última colocación</button>
          <button class="menu-btn" data-ability="hold"><kbd>5</kbd> Reservar pieza (hold)</button>
        </div>
        <p class="hint">Esc para cancelar</p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
